openapi: 3.0.3
info:
  title: CounterDeck API
  version: "1.0.0"
  description: >
    Read-only JSON API for Yu-Gi-Oh! card data and meta-deck counter sheets.
    Card data is ingested and normalized from the YGOPRODeck API; the Master Duel
    banlist (`md`) is derived from a second source because YGOPRODeck does not
    expose it.
servers:
  - url: /api/v1
paths:
  /cards:
    get:
      summary: List cards
      parameters:
        - { name: q, in: query, schema: { type: string }, description: Name search }
        - { name: archetype, in: query, schema: { type: string } }
        - { name: banlist_format, in: query, schema: { type: string, enum: [tcg, ocg, goat, md] } }
        - { name: banlist_status, in: query, schema: { type: string, enum: [forbidden, limited, semi_limited, unlimited] } }
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: per_page, in: query, schema: { type: integer, default: 25, maximum: 100 } }
      responses:
        "200":
          description: A page of cards
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/Card" } }
                  meta: { $ref: "#/components/schemas/PageMeta" }
  /cards/{id}:
    get:
      summary: Get a card (by internal id or YGOPRODeck ygo_id)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: Card detail }
        "404": { description: Not found }
  /decks:
    get:
      summary: List meta decks
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: format, in: query, schema: { type: string } }
        - { name: tier, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string, enum: [draft, verified] } }
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: per_page, in: query, schema: { type: integer, default: 25, maximum: 100 } }
      responses:
        "200": { description: A page of decks }
  /decks/{slug}:
    get:
      summary: Get a deck's full counter sheet
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Deck with key cards, hand traps, board breakers }
        "404": { description: Not found }
components:
  schemas:
    Card:
      type: object
      properties:
        id: { type: integer }
        ygo_id: { type: integer }
        name: { type: string }
        type: { type: string }
        attribute: { type: string }
        atk: { type: integer }
        def: { type: integer }
        archetype: { type: string }
        banlist:
          type: object
          properties:
            tcg: { type: string }
            ocg: { type: string }
            md: { type: string }
    PageMeta:
      type: object
      properties:
        total: { type: integer }
        page: { type: integer }
        per_page: { type: integer }
        total_pages: { type: integer }
